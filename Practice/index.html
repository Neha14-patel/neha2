<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">


    
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <!-- Accordion Start - ID yaha dena zaruri hai -->
      <div class="accordion" id="myFaq">

        <!-- ITEM 1 -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <!-- Button jo click hoga -->
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#q1">
              Hunkkaar kis OTT par hai?
            </button>
          </h2>
          <!-- Jo content khulega / band hoga -->
          <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#myFaq">
            <div class="accordion-body">
              Hunkkaar <strong>JioHotstar</strong> par available hai. Aap isko Hindi me dekh sakte ho.
            </div>
          </div>
        </div>

        <!-- ITEM 2 -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q2">
              Kya ye free hai?
            </button>
          </h2>
          <div id="q2" class="accordion-collapse collapse" data-bs-parent="#myFaq">
            <div class="accordion-body">
              Nahi, iske liye Hotstar ka subscription lena padega.
            </div>
          </div>
        </div>

        <!-- ITEM 3 -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q3">
              Kitne episodes hai?
            </button>
          </h2>
          <div id="q3" class="accordion-collapse collapse" data-bs-parent="#myFaq">
            <div class="accordion-body">
              Total 8 episodes hai, har episode 40 min ka hai.
            </div>
          </div>
        </div>

      </div>
      <!-- Accordion End -->

    </div>
  </div>
</div>
